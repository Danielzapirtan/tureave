<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>Planificare ture | Calculator ore lucrate</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(145deg, #f0f4f8 0%, #d9e2ec 100%);
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            margin: 0;
        }

        .container {
            max-width: 750px;
            width: 100%;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(18px);
            background: #ffffff;
            box-shadow: 0 25px 45px rgba(0, 20, 40, 0.15);
            border-radius: 2.5rem;
            padding: 2rem 2rem 2.3rem;
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: all 0.2s ease;
        }

        h1 {
            font-size: 1.9rem;
            font-weight: 600;
            color: #0b2b44;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            margin-bottom: 0.35rem;
            letter-spacing: -0.3px;
        }

        h1 span {
            background: #e6edf5;
            padding: 0.2rem 1rem;
            border-radius: 3rem;
            font-size: 1.1rem;
            font-weight: 500;
            color: #1f4a6b;
            margin-left: 0.5rem;
        }

        .subtitle {
            color: #3d5a73;
            margin-bottom: 1.8rem;
            font-size: 1rem;
            border-left: 4px solid #2c7da0;
            padding-left: 1rem;
            font-weight: 400;
        }

        .stats-panel {
            background: #f1f6fc;
            border-radius: 1.8rem;
            padding: 1.5rem 1.8rem;
            margin-bottom: 2rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            box-shadow: inset 0 1px 6px rgba(0,0,0,0.02);
            border: 1px solid #dce8f2;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.7px;
            font-weight: 600;
            color: #3b5c74;
        }

        .stat-value {
            font-size: 2.3rem;
            font-weight: 700;
            color: #0a3144;
            line-height: 1.2;
        }

        .stat-value small {
            font-size: 1rem;
            font-weight: 500;
            color: #4a6f8a;
        }

        .divider {
            width: 2px;
            height: 50px;
            background: #cbdbe9;
            border-radius: 1px;
        }

        .day-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 0.8rem;
            margin: 2rem 0 1.8rem;
        }

        .day-btn {
            background: white;
            border: 2px solid #cbdbe7;
            border-radius: 1.2rem;
            padding: 0.9rem 0.4rem;
            font-size: 1.1rem;
            font-weight: 600;
            color: #1a3a4e;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #fafdff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.02);
            line-height: 1.2;
        }

        .day-btn small {
            font-size: 0.7rem;
            font-weight: 500;
            text-transform: uppercase;
            opacity: 0.75;
            margin-top: 2px;
        }

        .day-btn.shift {
            background: #d4e6fc;
            border-color: #2f6b9c;
            color: #05253b;
            box-shadow: 0 6px 12px rgba(44, 110, 160, 0.15);
        }

        .day-btn.leave {
            background: #fde8d0;
            border-color: #c97f3c;
            color: #4b2e0e;
            box-shadow: 0 6px 12px rgba(180, 110, 30, 0.12);
        }

        .day-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.02);
            border-color: #7f9fb9;
        }

        .legend {
            display: flex;
            gap: 2rem;
            justify-content: center;
            margin: 0.6rem 0 0.2rem;
            font-size: 0.9rem;
            font-weight: 500;
            color: #27485e;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .legend-box {
            width: 18px;
            height: 18px;
            border-radius: 6px;
            background: #d4e6fc;
            border: 2px solid #2f6b9c;
        }

        .legend-box.leave-box {
            background: #fde8d0;
            border-color: #c97f3c;
        }

        .reset-area {
            display: flex;
            justify-content: flex-end;
            margin-top: 1.2rem;
        }

        .reset-btn {
            background: transparent;
            border: 1.5px solid #b6ccda;
            background: #ffffff;
            padding: 0.6rem 1.6rem;
            border-radius: 2.5rem;
            font-weight: 600;
            color: #1f4460;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.95rem;
            transition: 0.2s;
        }

        .reset-btn:hover {
            background: #e9f2fa;
            border-color: #5685a6;
            color: #032539;
        }

        @media (max-width: 500px) {
            .container {
                padding: 1.5rem;
            }
            .stat-value {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>
        🗓️ Planificare lunară
        <span>ture/concediu</span>
    </h1>
    <input type="checkbox" id="sept">Sept</input>
    <div class="subtitle">Atinge o zi pentru a comuta între tură (12h) și concediu (8h)</div>

    <!-- Statistics display -->
    <div class="stats-panel">
        <div class="stat-item">
            <span class="stat-label">📌 Zile concediu</span>
            <span class="stat-value" id="leaveCount">0</span>
        </div>
        <div class="divider"></div>
        <div class="stat-item">
            <span class="stat-label">⏱️ Ore lucrate</span>
            <span class="stat-value" id="workedHours">0 <small>ore</small></span>
        </div>
        <div class="stat-item">
            <span class="stat-label">🔹 Zile tură</span>
            <span class="stat-value" id="shiftCount">16</span>
        </div>
    </div>

    <!-- Calendar grid for days 1-31 -->
    <div class="day-grid" id="dayGrid"></div>

    <!-- Legend -->
    <div class="legend">
        <div class="legend-item"><span class="legend-box"></span> Tură (12h)</div>
        <div class="legend-item"><span class="legend-box leave-box"></span> Concediu (8h)</div>
    </div>

    <div class="reset-area">
        <button class="reset-btn" id="resetButton">
            <span>↺</span> Resetare implicită
        </button>
    </div>
</div>

<script>
    (function() {
        // ----- State management (mirrors Bash variables) -----
        // shiftDays holds days that are work shifts (12h each)
        let shiftDays = [];
        // leaveDays holds days that are leave (8h each)
        let leaveDays = [];
	let sept = false;
	let maxDay = 31;
	const septElement = document.getElementById("sept");
	septElement.addEventListener("input", (e) => {
		sept = septElement.checked;
		maxDay = sept ? 30 : 31;
		resetToDefaults();
	});

        // ----- Initialize default shift days according to script: for n in $(seq 1 4 31); do n2=$(($n + 1)); shiftDays="$shiftDays $n $n2"; done
        function buildDefaultShiftDays() {
            const days = [];
	    if (!sept) {
		days.push(1);
	    }
            for (let n = sept ? 2 : 4; n <= maxDay; n += 4) {
                days.push(n);
                const n2 = n + 1;
                if (n2 <= maxDay) {
                    days.push(n2);
                }
            }
            // Ensure uniqueness and sorted numerically (already sorted by generation)
            return [...new Set(days)].sort((a, b) => a - b);
        }

        // Initialize leaveDays as empty array (as in script)
        function resetToDefaults() {
            shiftDays = buildDefaultShiftDays();
            leaveDays = [];
            renderAll();
        }

        // ----- Helper: check if a day is in an array (like grep -qw)
        function arrayIncludesDay(arr, day) {
            return arr.includes(day);
        }

        // ----- Toggle function: mirrors the bash toggle logic exactly
        function toggleDay(day) {
            const dayNum = Number(day);
            if (isNaN(dayNum) || dayNum < 1 || dayNum > maxDay) return;

            if (arrayIncludesDay(shiftDays, dayNum)) {
                // Day is in shiftDays -> move to leaveDays
                shiftDays = shiftDays.filter(d => d !== dayNum);
                // Add to leaveDays and sort
                leaveDays.push(dayNum);
                leaveDays = leaveDays.sort((a, b) => a - b);
            } else if (arrayIncludesDay(leaveDays, dayNum)) {
                // Day is in leaveDays -> move back to shiftDays
                leaveDays = leaveDays.filter(d => d !== dayNum);
                shiftDays.push(dayNum);
                shiftDays = shiftDays.sort((a, b) => a - b);
            }
            // If day not in either (should not happen with UI, but safe to ignore)
            renderAll();
        }

        // ----- Compute statistics (showStats equivalent)
        function computeStats() {
            const numShift = shiftDays.length;
            const numLeave = leaveDays.length;
            const numHours = numShift * 12 + numLeave * 8;
            return {
                numShift,
                numLeave,
                numHours
            };
        }

        // ----- UI rendering -----
        const dayGridEl = document.getElementById('dayGrid');
        const leaveCountEl = document.getElementById('leaveCount');
        const workedHoursEl = document.getElementById('workedHours');
        const shiftCountEl = document.getElementById('shiftCount');

        // Create day buttons for days 1..31
        function renderDayGrid() {
            if (!dayGridEl) return;
            dayGridEl.innerHTML = '';

            for (let day = 1; day <= maxDay; day++) {
                const button = document.createElement('button');
                button.className = 'day-btn';
                button.setAttribute('data-day', day);

                // Determine if day is shift or leave
                const isShift = arrayIncludesDay(shiftDays, day);
                const isLeave = arrayIncludesDay(leaveDays, day);

                if (isShift) {
                    button.classList.add('shift');
                } else if (isLeave) {
                    button.classList.add('leave');
                }

                // Add day number and small label
                button.innerHTML = `${day}<small>${isShift ? 'tură' : isLeave ? 'concediu' : '—'}</small>`;

                button.addEventListener('click', (e) => {
                    const dayValue = parseInt(e.currentTarget.getAttribute('data-day'), 10);
                    toggleDay(dayValue);
                });

                dayGridEl.appendChild(button);
            }
        }

        // Update statistics display
        function updateStatsDisplay() {
            const stats = computeStats();
            if (leaveCountEl) leaveCountEl.textContent = stats.numLeave;
            if (workedHoursEl) workedHoursEl.innerHTML = `${stats.numHours} <small>ore</small>`;
            if (shiftCountEl) shiftCountEl.textContent = stats.numShift;
        }

        // Refresh entire UI (grid + stats)
        function renderAll() {
            renderDayGrid();
            updateStatsDisplay();
        }

        // ----- Reset button handler -----
        document.getElementById('resetButton').addEventListener('click', () => {
            resetToDefaults();
        });

        // ----- Initial load: set default state and render -----
        resetToDefaults();

        // Optional: ensure any leftover state consistency (though reset covers it)
        // Also show active state on first paint.
    })();
</script>
</body>
</html>
